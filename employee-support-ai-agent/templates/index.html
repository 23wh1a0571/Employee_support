<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Support AI Chatbot</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 650px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 80vh; }
        .chat-header { background: #2c3e50; color: #fff; padding: 15px; border-top-left-radius: 8px; border-top-right-radius: 8px; font-weight: bold; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 6px; line-height: 1.4; word-wrap: break-word; }
        .user { align-self: flex-end; background: #007bff; color: white; }
        .bot { align-self: flex-start; background: #e9ecef; color: #212529; white-space: pre-wrap; }
        .input-area { display: flex; border-top: 1px solid #dee2e6; padding: 10px; background: #fafafa; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ced4da; border-radius: 4px; outline: none; }
        button { margin-left: 10px; padding: 10px 18px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">Enterprise HR & IT Support Assistant</div>
        <div class="chat-box" id="chatBox">
            <div class="message bot">Hello! I am your Employee Support Assistant. Ask me about policies, leave balances, or ticket statuses.</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your query here..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const userText = inputField.value.trim();

            if (!userText) return;

            // Display user message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user';
            userDiv.innerText = userText;
            chatBox.appendChild(userDiv);
            inputField.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Display loading placeholder
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.innerText = 'Thinking...';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: userText })
                });
                const data = await res.json();
                loadingDiv.innerText = data.response;
            } catch (err) {
                loadingDiv.innerText = "Error connecting to backend server.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
